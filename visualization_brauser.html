<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Покер: Человек против ИИ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .game-area {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            margin-bottom: 20px;
        }

        .poker-table {
            background: radial-gradient(ellipse at center, #2d5016 0%, #1a3009 100%);
            border: 20px solid #3d2817;
            border-radius: 50%;
            aspect-ratio: 2/1;
            position: relative;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .community-cards {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            min-height: 100px;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 70px;
            height: 100px;
            background: white;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.3s;
            position: relative;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .card.hearts, .card.diamonds {
            color: #d32f2f;
        }

        .card.spades, .card.clubs {
            color: #000;
        }

        .card.back {
            background: linear-gradient(135deg, #1976d2 0%, #0d47a1 100%);
            color: white;
        }

        .card.back::before {
            content: '🂠';
            font-size: 2em;
        }

        .players-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .player {
            position: absolute;
            width: 180px;
            background: rgba(0,0,0,0.7);
            border: 3px solid #ffd700;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s;
        }

        .player.human {
            border-color: #4caf50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        .player.active {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
        }

        .player.folded {
            opacity: 0.4;
            filter: grayscale(100%);
        }

        .player-name {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .player-stack {
            font-size: 0.9em;
            color: #ffd700;
            margin-bottom: 8px;
        }

        .player-cards {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin-top: 8px;
        }

        .player-cards .card {
            width: 50px;
            height: 70px;
            font-size: 1em;
        }

        .pot-display {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 10px 30px;
            border-radius: 20px;
            font-size: 1.3em;
            font-weight: bold;
            color: #ffd700;
        }

        .stage-display {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 8px 25px;
            border-radius: 15px;
            font-size: 1.1em;
        }

        .controls {
            background: rgba(0,0,0,0.7);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .controls h3 {
            text-align: center;
            margin-bottom: 10px;
        }

        .button {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .button.fold {
            background: #f44336;
            color: white;
        }

        .button.check {
            background: #2196f3;
            color: white;
        }

        .button.call {
            background: #4caf50;
            color: white;
        }

        .button.raise {
            background: #ff9800;
            color: white;
        }

        .raise-input {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }

        .raise-input input {
            flex: 1;
            padding: 10px;
            border: 2px solid #ffd700;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 1em;
        }

        .log-panel {
            background: rgba(0,0,0,0.7);
            border-radius: 15px;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .log-panel h3 {
            margin-bottom: 10px;
        }

        .log-entry {
            padding: 5px;
            margin: 3px 0;
            border-left: 3px solid #ffd700;
            padding-left: 10px;
            font-size: 0.9em;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .settings {
            background: rgba(0,0,0,0.7);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .settings input, .settings select {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 2px solid #ffd700;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .hand-info {
            background: rgba(0,0,0,0.7);
            border-radius: 15px;
            padding: 15px;
            margin-top: 10px;
            text-align: center;
        }

        .hand-info .strength {
            font-size: 1.2em;
            color: #ffd700;
            margin: 5px 0;
        }

        @media (max-width: 1200px) {
            .game-area {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 Покер: Человек против ИИ</h1>

        <div class="settings">
            <h3>⚙️ Настройки игры</h3>
            <label>Количество ИИ-игроков (1-8):</label>
            <input type="number" id="aiCount" min="1" max="8" value="3">
            <label>URL сервера LLM (опционально):</label>
            <input type="text" id="serverUrl" placeholder="http://localhost:8899">
            <button class="button call" onclick="startGame()">🎮 Начать игру</button>
        </div>

        <div class="game-area">
            <div class="poker-table" id="pokerTable">
                <div class="pot-display" id="potDisplay">Банк: $0</div>
                <div class="community-cards" id="communityCards"></div>
                <div class="stage-display" id="stageDisplay">Префлоп</div>
                <div class="players-ring" id="playersRing"></div>
            </div>

            <div class="controls">
                <h3>🎯 Твой ход</h3>
                <div class="hand-info" id="handInfo">
                    <div>Твоя рука:</div>
                    <div class="strength" id="handStrength">-</div>
                    <div id="handDescription">-</div>
                </div>
                <div class="raise-input">
                    <input type="number" id="raiseAmount" placeholder="Сумма рейза">
                </div>
                <button class="button fold" id="foldBtn" onclick="playerAction('fold')">👎 Фолд</button>
                <button class="button check" id="checkBtn" onclick="playerAction('check')">✋ Чек</button>
                <button class="button call" id="callBtn" onclick="playerAction('call')">✅ Колл</button>
                <button class="button raise" id="raiseBtn" onclick="playerAction('raise')">🔥 Рейз</button>
            </div>
        </div>

        <div class="log-panel">
            <h3>📜 История действий</h3>
            <div id="logContainer"></div>
        </div>
    </div>

    <script>
        // ============================================
        // КАРТЫ И КОЛОДА
        // ============================================
        
        class Card {
            constructor(rank, suit) {
                this.rank = rank;
                this.suit = suit;
            }

            toString() {
                const names = {11: 'J', 12: 'Q', 13: 'K', 14: 'A'};
                return `${names[this.rank] || this.rank}${this.suit}`;
            }

            getSuitClass() {
                const suitMap = {'♠': 'spades', '♥': 'hearts', '♦': 'diamonds', '♣': 'clubs'};
                return suitMap[this.suit];
            }
        }

        class Deck {
            constructor() {
                this.cards = [];
                this.reset();
            }

            reset() {
                this.cards = [];
                const suits = ['♠', '♥', '♦', '♣'];
                for (let r = 2; r <= 14; r++) {
                    for (let s of suits) {
                        this.cards.push(new Card(r, s));
                    }
                }
                this.shuffle();
            }

            shuffle() {
                for (let i = this.cards.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [this.cards[i], this.cards[j]] = [this.cards[j], this.cards[i]];
                }
            }

            deal(n = 1) {
                return this.cards.splice(-n, n);
            }
        }

        // ============================================
        // ОЦЕНЩИК РУК
        // ============================================

        class HandEvaluator {
            static CATEGORY_NAMES = {
                8: "Роял-флеш", 7: "Стрит-флеш", 6: "Каре",
                5: "Фулл-хаус", 4: "Флеш", 3: "Стрит",
                2: "Сет", 1: "Две пары", 0: "Пара", [-1]: "Старшая карта"
            };

            static evaluate(cards) {
                let best = null;
                const combos = this.combinations(cards, 5);
                for (let combo of combos) {
                    const score = this.score5(combo);
                    if (best === null || this.compareScores(score, best) > 0) {
                        best = score;
                    }
                }
                return best;
            }

            static combinations(arr, k) {
                const result = [];
                const combo = [];
                
                function backtrack(start) {
                    if (combo.length === k) {
                        result.push([...combo]);
                        return;
                    }
                    for (let i = start; i < arr.length; i++) {
                        combo.push(arr[i]);
                        backtrack(i + 1);
                        combo.pop();
                    }
                }
                
                backtrack(0);
                return result;
            }

            static score5(cards) {
                const ranks = cards.map(c => c.rank).sort((a, b) => b - a);
                const suits = cards.map(c => c.suit);
                const isFlush = new Set(suits).size === 1;

                let isStraight = false;
                let straightHigh = 0;
                const unique = [...new Set(ranks)].sort((a, b) => b - a);
                
                if (unique.length === 5) {
                    if (unique[0] - unique[4] === 4) {
                        isStraight = true;
                        straightHigh = unique[0];
                    } else if (JSON.stringify(unique) === JSON.stringify([14, 5, 4, 3, 2])) {
                        isStraight = true;
                        straightHigh = 5;
                    }
                }

                const counts = {};
                ranks.forEach(r => counts[r] = (counts[r] || 0) + 1);
                const countValues = Object.values(counts).sort((a, b) => b - a);

                let category;
                if (isFlush && isStraight) {
                    category = straightHigh === 14 ? 8 : 7;
                } else if (countValues[0] === 4) {
                    category = 6;
                } else if (countValues[0] === 3 && countValues[1] === 2) {
                    category = 5;
                } else if (isFlush) {
                    category = 4;
                } else if (isStraight) {
                    category = 3;
                } else if (countValues[0] === 3) {
                    category = 2;
                } else if (countValues[0] === 2 && countValues[1] === 2) {
                    category = 1;
                } else if (countValues[0] === 2) {
                    category = 0;
                } else {
                    category = -1;
                }

                const groups = {};
                for (let [rank, cnt] of Object.entries(counts)) {
                    if (!groups[cnt]) groups[cnt] = [];
                    groups[cnt].push(parseInt(rank));
                }

                const kickers = [];
                const sortedCounts = Object.keys(groups).sort((a, b) => b - a);
                for (let cnt of sortedCounts) {
                    kickers.push(...groups[cnt].sort((a, b) => b - a));
                }

                return [category, kickers];
            }

            static compareScores(a, b) {
                if (a[0] !== b[0]) return a[0] - b[0];
                for (let i = 0; i < Math.min(a[1].length, b[1].length); i++) {
                    if (a[1][i] !== b[1][i]) return a[1][i] - b[1][i];
                }
                return 0;
            }

            static categoryName(score) {
                return this.CATEGORY_NAMES[score[0]] || "Неизвестно";
            }

            static effectiveStrength(cards, community, stage) {
                if (!community || community.length === 0) {
                    return this.preflopStrength(cards);
                }

                const allCards = [...cards, ...community];
                const score = this.evaluate(allCards);
                let base = (score[0] + 1) / 9.0;

                let drawBonus = 0;
                if (stage !== 'Ривер') {
                    const suitCounts = {};
                    allCards.forEach(c => suitCounts[c.suit] = (suitCounts[c.suit] || 0) + 1);
                    for (let count of Object.values(suitCounts)) {
                        if (count === 4) {
                            drawBonus += 0.20;
                            break;
                        }
                    }

                    const ranks = [...new Set(allCards.map(c => c.rank))].sort((a, b) => a - b);
                    for (let start = 2; start <= 10; start++) {
                        const window = new Set();
                        for (let i = start; i < start + 5; i++) window.add(i);
                        const intersection = ranks.filter(r => window.has(r));
                        if (intersection.length === 4) {
                            drawBonus += 0.15;
                            break;
                        }
                    }
                }

                return Math.min(base + drawBonus, 1.0);
            }

            static preflopStrength(cards) {
                if (cards.length < 2) return 0.0;
                const [r1, r2] = [cards[0].rank, cards[1].rank].sort((a, b) => b - a);
                const suited = cards[0].suit === cards[1].suit;
                
                if (r1 === r2) {
                    return Math.min(0.5 + (r1 - 2) / 24.0, 1.0);
                }

                let score = (r1 + r2) / 28.0 * 0.4;
                if (suited) score += 0.1;
                if (r1 - r2 <= 2) score += 0.05;
                if (r1 === 14) score += 0.1;

                return Math.min(Math.max(score, 0.0), 1.0);
            }

            static strengthDesc(strength) {
                if (strength >= 0.8) return "очень сильная";
                if (strength >= 0.6) return "сильная";
                if (strength >= 0.4) return "средняя";
                if (strength >= 0.2) return "слабая";
                return "очень слабая";
            }
        }

        // ============================================
        // ИГРОКИ
        // ============================================

        class Player {
            constructor(name, stack, isHuman = false) {
                this.name = name;
                this.stack = stack;
                this.cards = [];
                this.currentBet = 0;
                this.folded = false;
                this.eliminated = false;
                this.isHuman = isHuman;
            }

            resetHand() {
                this.cards = [];
                this.currentBet = 0;
                this.folded = false;
            }
        }

        // ============================================
        // ИГРА
        // ============================================

        const SMALL_BLIND = 5;
        const BIG_BLIND = 10;
        const START_STACK = 1000;

        let game = {
            players: [],
            deck: new Deck(),
            communityCards: [],
            pot: 0,
            currentBet: 0,
            dealerPos: 0,
            stage: 'Префлоп',
            handNumber: 0,
            isPlaying: false,
            serverUrl: ''
        };

        function createCardElement(card, hidden = false) {
            const div = document.createElement('div');
            div.className = `card ${hidden ? 'back' : card.getSuitClass()}`;
            if (!hidden) {
                div.textContent = card.toString();
            }
            return div;
        }

        function updatePlayerPositions() {
            const ring = document.getElementById('playersRing');
            ring.innerHTML = '';
            
            const count = game.players.length;
            const radius = 45;
            
            game.players.forEach((player, index) => {
                const angle = (index / count) * 2 * Math.PI - Math.PI / 2;
                const x = 50 + radius * Math.cos(angle);
                const y = 50 + radius * Math.sin(angle);

                const playerDiv = document.createElement('div');
                playerDiv.className = 'player';
                if (player.isHuman) playerDiv.classList.add('human');
                if (player.folded) playerDiv.classList.add('folded');
                
                playerDiv.style.left = `${x}%`;
                playerDiv.style.top = `${y}%`;
                playerDiv.style.transform = 'translate(-50%, -50%)';

                const nameDiv = document.createElement('div');
                nameDiv.className = 'player-name';
                nameDiv.textContent = player.isHuman ? '👤 ТЫ' : `🤖 ${player.name}`;

                const stackDiv = document.createElement('div');
                stackDiv.className = 'player-stack';
                stackDiv.textContent = `$${player.stack}`;

                const cardsDiv = document.createElement('div');
                cardsDiv.className = 'player-cards';
                
                if (player.cards.length > 0) {
                    if (player.isHuman || !game.isPlaying) {
                        player.cards.forEach(card => {
                            cardsDiv.appendChild(createCardElement(card));
                        });
                    } else {
                        cardsDiv.appendChild(createCardElement(null, true));
                        cardsDiv.appendChild(createCardElement(null, true));
                    }
                }

                playerDiv.appendChild(nameDiv);
                playerDiv.appendChild(stackDiv);
                playerDiv.appendChild(cardsDiv);
                ring.appendChild(playerDiv);
            });
        }

        function updateCommunityCards() {
            const container = document.getElementById('communityCards');
            container.innerHTML = '';
            game.communityCards.forEach(card => {
                container.appendChild(createCardElement(card));
            });
        }

        function updatePot() {
            document.getElementById('potDisplay').textContent = `Банк: $${game.pot}`;
        }

        function updateStage() {
            document.getElementById('stageDisplay').textContent = game.stage;
        }

        function addLog(message) {
            const container = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = message;
            container.insertBefore(entry, container.firstChild);
            
            if (container.children.length > 50) {
                container.removeChild(container.lastChild);
            }
        }

        function startGame() {
            const aiCount = parseInt(document.getElementById('aiCount').value);
            game.serverUrl = document.getElementById('serverUrl').value;
            
            game.players = [new Player('ТЫ', START_STACK, true)];
            
            const styles = [
                {name: 'ИИ_1', style: 'тайтовый'},
                {name: 'ИИ_2', style: 'лузовый'},
                {name: 'ИИ_3', style: 'агрессивный'},
                {name: 'ИИ_4', style: 'осторожный'},
                {name: 'ИИ_5', style: 'хитрый'},
                {name: 'ИИ_6', style: 'математик'},
                {name: 'ИИ_7', style: 'безумный'},
                {name: 'ИИ_8', style: 'профи'}
            ];

            for (let i = 0; i < aiCount; i++) {
                game.players.push(new Player(styles[i].name, START_STACK, false));
            }

            game.isPlaying = true;
            game.handNumber = 0;
            game.dealerPos = 0;

            addLog(`🎮 Игра началась! Игроков: ${game.players.length}`);
            playHand();
        }

        async function playHand() {
            if (!game.isPlaying) return;

            game.handNumber++;
            game.deck.reset();
            game.communityCards = [];
            game.pot = 0;
            game.currentBet = 0;

            game.players.forEach(p => p.resetHand());

            addLog(`\n🎰 Раздача #${game.handNumber}`);

            // Раздача карт
            game.players.forEach(p => {
                if (!p.eliminated) {
                    p.cards = game.deck.deal(2);
                }
            });

            // Блайнды
            const alive = game.players.filter(p => !p.eliminated);
            const sbPos = (game.dealerPos + 1) % alive.length;
            const bbPos = (game.dealerPos + 2) % alive.length;

            postBlind(alive[sbPos], SMALL_BLIND);
            postBlind(alive[bbPos], BIG_BLIND);
            game.currentBet = BIG_BLIND;

            addLog(`💰 Блайнды: ${alive[sbPos].name}=$${SMALL_BLIND}, ${alive[bbPos].name}=$${BIG_BLIND}`);

            updatePlayerPositions();
            updateCommunityCards();
            updatePot();

            // Стадии
            const stages = [
                {name: 'Префлоп', cards: 0},
                {name: 'Флоп', cards: 3},
                {name: 'Тёрн', cards: 1},
                {name: 'Ривер', cards: 1}
            ];

            for (let stage of stages) {
                game.stage = stage.name;
                updateStage();

                if (stage.cards > 0) {
                    const newCards = game.deck.deal(stage.cards);
                    game.communityCards.push(...newCards);
                    updateCommunityCards();
                    addLog(`🃏 ${stage.name}: ${newCards.map(c => c.toString()).join(' ')}`);
                    await sleep(1000);
                }

                if (stage.name !== 'Префлоп') {
                    game.currentBet = 0;
                    game.players.forEach(p => p.currentBet = 0);
                }

                await bettingRound(stage.name);

                const active = game.players.filter(p => !p.folded && !p.eliminated);
                if (active.length === 1) {
                    const winner = active[0];
                    winner.stack += game.pot;
                    addLog(`🏆 ${winner.name} выигрывает $${game.pot} (все сбросили)`);
                    updatePlayerPositions();
                    await sleep(2000);
                    nextHand();
                    return;
                }

                updatePot();
            }

            // Вскрытие
            await showdown();
        }

        async function bettingRound(stage) {
            const alive = game.players.filter(p => !p.eliminated && !p.folded);
            
            for (let player of alive) {
                if (player.folded || player.eliminated) continue;

                const toCall = game.currentBet - player.currentBet;
                const minRaise = game.currentBet + BIG_BLIND;

                let action, amount;

                if (player.isHuman) {
                    // Ход человека
                    await humanTurn(player, toCall, minRaise, stage);
                    return;
                } else {
                    // Ход ИИ
                    await sleep(500);
                    const decision = await aiDecision(player, toCall, minRaise, stage);
                    action = decision.action;
                    amount = decision.amount;
                }

                executeAction(player, action, amount, toCall);
                await sleep(500);

                const active = game.players.filter(p => !p.folded && !p.eliminated);
                if (active.length <= 1) return;
            }
        }

        async function humanTurn(player, toCall, minRaise, stage) {
            const strength = HandEvaluator.effectiveStrength(
                player.cards, 
                game.communityCards, 
                stage
            );
            const desc = HandEvaluator.strengthDesc(strength);

            document.getElementById('handStrength').textContent = `${(strength * 100).toFixed(0)}%`;
            document.getElementById('handDescription').textContent = desc;

            const foldBtn = document.getElementById('foldBtn');
            const checkBtn = document.getElementById('checkBtn');
            const callBtn = document.getElementById('callBtn');
            const raiseBtn = document.getElementById('raiseBtn');

            foldBtn.disabled = toCall === 0;
            checkBtn.disabled = toCall > 0;
            callBtn.disabled = toCall === 0;
            callBtn.textContent = `✅ Колл $${toCall}`;
            raiseBtn.disabled = false;

            addLog(`🎯 Твой ход [${stage}]`);

            // Ждем клика
            return new Promise(resolve => {
                window.currentResolve = resolve;
                window.currentPlayer = player;
                window.currentToCall = toCall;
                window.currentMinRaise = minRaise;
            });
        }

        function playerAction(action) {
            const player = window.currentPlayer;
            const toCall = window.currentToCall;
            const minRaise = window.currentMinRaise;

            let amount = 0;

            if (action === 'fold') {
                player.folded = true;
                addLog(`❌ ТЫ: ФОЛД`);
            } else if (action === 'check') {
                addLog(`✋ ТЫ: ЧЕК`);
            } else if (action === 'call') {
                amount = Math.min(toCall, player.stack);
                player.stack -= amount;
                player.currentBet += amount;
                game.pot += amount;
                addLog(`✅ ТЫ: КОЛЛ $${amount}`);
            } else if (action === 'raise') {
                const raiseInput = document.getElementById('raiseAmount').value;
                amount = parseInt(raiseInput) || minRaise;
                amount = Math.max(amount, minRaise);
                amount = Math.min(amount, player.stack);
                
                player.stack -= amount;
                player.currentBet += amount;
                game.pot += amount;
                game.currentBet = player.currentBet;
                addLog(`🔥 ТЫ: РЕЙЗ $${amount}`);
            }

            updatePlayerPositions();
            updatePot();

            document.getElementById('foldBtn').disabled = true;
            document.getElementById('checkBtn').disabled = true;
            document.getElementById('callBtn').disabled = true;
            document.getElementById('raiseBtn').disabled = true;

            if (window.currentResolve) {
                window.currentResolve();
                window.currentResolve = null;
            }

            setTimeout(() => continueBetting(), 500);
        }

        async function continueBetting() {
            const alive = game.players.filter(p => !p.folded && !p.eliminated);
            if (alive.length <= 1) {
                const winner = alive[0];
                if (winner) {
                    winner.stack += game.pot;
                    addLog(`🏆 ${winner.name} выигрывает $${game.pot}`);
                }
                updatePlayerPositions();
                await sleep(2000);
                nextHand();
                return;
            }

            await bettingRound(game.stage);
        }

        async function aiDecision(player, toCall, minRaise, stage) {
            const strength = HandEvaluator.effectiveStrength(
                player.cards,
                game.communityCards,
                stage
            );

            const randomFactor = 0.9 + Math.random() * 0.2;
            const adjustedStrength = Math.min(strength * randomFactor, 1.0);

            // Простая логика ИИ
            let action, amount;

            if (adjustedStrength >= 0.7) {
                // Сильная рука - рейз
                action = 'raise';
                amount = Math.min(game.pot * 0.5, player.stack);
                amount = Math.max(amount, minRaise);
            } else if (adjustedStrength >= 0.4) {
                // Средняя рука
                if (toCall === 0) {
                    action = 'check';
                    amount = 0;
                } else if (toCall < player.stack * 0.15) {
                    action = 'call';
                    amount = toCall;
                } else {
                    action = 'fold';
                    amount = 0;
                }
            } else {
                // Слабая рука
                if (toCall === 0) {
                    action = 'check';
                    amount = 0;
                } else if (toCall < player.stack * 0.05 && Math.random() < 0.3) {
                    action = 'call';
                    amount = toCall;
                } else {
                    action = 'fold';
                    amount = 0;
                }
            }

            addLog(`🤖 ${player.name}: ${action.toUpperCase()} ${amount > 0 ? '$' + amount : ''}`);

            // Попытка использовать сервер LLM
            if (game.serverUrl && !player.isHuman) {
                try {
                    const prompt = buildPrompt(player, toCall, minRaise, stage, adjustedStrength);
                    const response = await callLLMServer(prompt);
                    if (response) {
                        const parsed = parseAIResponse(response);
                        action = parsed.action;
                        amount = parsed.amount;
                    }
                } catch (e) {
                    console.log('LLM server not available, using local AI');
                }
            }

            return {action, amount};
        }

        function buildPrompt(player, toCall, minRaise, stage, strength) {
            const cardsStr = player.cards.map(c => c.toString()).join(' ');
            const commStr = game.communityCards.map(c => c.toString()).join(' ') || 'нет';
            
            return `Покерная ситуация:
- Стадия: ${stage}
- Твои карты: ${cardsStr}
- На столе: ${commStr}
- Сила руки: ${(strength * 100).toFixed(0)}%
- Банк: $${game.pot}
- Нужно уравнять: $${toCall}
- Минимальный рейз: $${minRaise}
- Твой стек: $${player.stack}

Выбери действие: ФОЛД, КОЛЛ, ЧЕК или РЕЙЗ.
Ответь одной строкой: ДЕЙСТВИЕ: [действие] | СУММА: [число]`;
        }

        async function callLLMServer(prompt) {
            const response = await fetch(game.serverUrl, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({prompt: prompt, max_tokens: 80})
            });
            
            const data = await response.json();
            return data.response || '';
        }

        function parseAIResponse(response) {
            const upper = response.toUpperCase();
            let action = 'check';
            
            if (upper.includes('ФОЛД') || upper.includes('FOLD')) {
                action = 'fold';
            } else if (upper.includes('РЕЙЗ') || upper.includes('RAISE')) {
                action = 'raise';
            } else if (upper.includes('КОЛЛ') || upper.includes('CALL')) {
                action = 'call';
            }

            const nums = response.match(/\d+/g);
            const amount = nums ? parseInt(nums[nums.length - 1]) : 0;

            return {action, amount};
        }

        function executeAction(player, action, amount, toCall) {
            if (action === 'fold') {
                player.folded = true;
                addLog(`❌ ${player.name}: ФОЛД`);
            } else if (action === 'check') {
                addLog(`✋ ${player.name}: ЧЕК`);
            } else if (action === 'call') {
                const actual = Math.min(toCall, player.stack);
                if (actual > 0) {
                    player.stack -= actual;
                    player.currentBet += actual;
                    game.pot += actual;
                    addLog(`✅ ${player.name}: КОЛЛ $${actual}`);
                } else {
                    addLog(`✋ ${player.name}: ЧЕК`);
                }
            } else if (action === 'raise') {
                const total = Math.min(amount, player.stack);
                if (total <= toCall) {
                    const actual = Math.min(toCall, player.stack);
                    if (actual > 0) {
                        player.stack -= actual;
                        player.currentBet += actual;
                        game.pot += actual;
                        addLog(`✅ ${player.name}: КОЛЛ $${actual}`);
                    }
                } else {
                    player.stack -= total;
                    player.currentBet += total;
                    game.pot += total;
                    game.currentBet = player.currentBet;
                    addLog(`🔥 ${player.name}: РЕЙЗ $${total}`);
                }
            }

            updatePlayerPositions();
            updatePot();
        }

        function postBlind(player, amount) {
            const actual = Math.min(amount, player.stack);
            player.stack -= actual;
            player.currentBet = actual;
            game.pot += actual;
        }

        async function showdown() {
            addLog(`🔓 ВСКРЫТИЕ КАРТ`);
            
            const active = game.players.filter(p => !p.folded && !p.eliminated);
            
            let bestScore = null;
            let winners = [];

            for (let player of active) {
                const allCards = [...player.cards, ...game.communityCards];
                const score = HandEvaluator.evaluate(allCards);
                const handName = HandEvaluator.categoryName(score);
                
                addLog(`${player.name}: ${player.cards.map(c => c.toString()).join(' ')} → ${handName}`);

                if (bestScore === null || HandEvaluator.compareScores(score, bestScore) > 0) {
                    bestScore = score;
                    winners = [player];
                } else if (HandEvaluator.compareScores(score, bestScore) === 0) {
                    winners.push(player);
                }
            }

            const share = Math.floor(game.pot / winners.length);
            winners.forEach(w => {
                w.stack += share;
                addLog(`🏆 ${w.name} выигрывает $${share}`);
            });

            updatePlayerPositions();
            await sleep(3000);
            nextHand();
        }

        function nextHand() {
            game.dealerPos = (game.dealerPos + 1) % game.players.length;
            
            const alive = game.players.filter(p => !p.eliminated);
            if (alive.length <= 1) {
                game.isPlaying = false;
                const winner = alive[0];
                if (winner) {
                    addLog(`\n🎉 ПОБЕДИТЕЛЬ ТУРНИРА: ${winner.name}!`);
                }
                return;
            }

            setTimeout(() => playHand(), 1000);
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Инициализация
        updatePlayerPositions();
    </script>
</body>
