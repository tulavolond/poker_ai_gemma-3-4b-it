<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Poker Model Tester</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #111;
      color: #eee;
    }

    h1 {
      color: #fff;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      background: #181818;
      color: #eee;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px;
      font-family: monospace;
      font-size: 13px;
      margin-bottom: 12px;
    }

    button {
      background: #2d7ff9;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      margin-right: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #1e63d0;
    }

    .preset-btn {
      background: #444;
    }

    .preset-btn:hover {
      background: #666;
    }

    .panel {
      background: #181818;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 14px;
      margin-top: 16px;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      min-height: 80px;
    }

    .good {
      color: #6dff6d;
      font-weight: bold;
    }

    .bad {
      color: #ff6d6d;
      font-weight: bold;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #aaa;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>Poker Model Tester</h1>

  <div>
    <button class="preset-btn" onclick="setPreset('stage2')">Stage 2: пот-оддсы</button>
    <button class="preset-btn" onclick="setPreset('stage3')">Stage 3: префлоп открытие</button>
    <button class="preset-btn" onclick="setPreset('stage4')">Stage 4: против рейза</button>
    <button onclick="sendDecide()">Отправить в модель</button>
  </div>

  <div class="panel">
    <label>System</label>
    <textarea id="system"></textarea>

    <label>User</label>
    <textarea id="user"></textarea>
  </div>

  <div class="panel">
    <h3>Распознанное действие</h3>
    <div id="parsed" class="bad">—</div>
  </div>

  <div class="panel">
    <h3>Сырой ответ модели</h3>
    <pre id="raw"></pre>
  </div>

  <script>
    const PRESETS = {
      stage2: {
        system: `Ты эксперт по Техасскому Холдему без лимита. Факты (комбинация, эквити, пот-оддсы) уже посчитаны движком и даны в вопросе — не пересчитывай их. Правило: эквити >= пот-оддсы -> Колл; эквити < пот-оддсы -> Фолд; при точном равенстве -> Колл. Имплайд-оддсы не учитываем (бонус 0). Рейзы и блефы не рассматриваются. В <thought> запиши сравнение двух чисел, в <action> — ровно "Фолд" или "Колл {размер}bb".`,
        user: `NLH cash. Ты на BB, оппонент на BTN. Улица: флоп.
Твоя рука: 9♣ 8♣. Доска: K♣ 7♣ 2♠.
Банк 6.00bb. Оппонент ставит 2.00bb (⅓ банка). Колл = 2.00bb.
Факты (посчитаны движком): комбинация — флеш-дро; эквити = 40.00%; пот-оддсы = 20.00%; имплайд-бонус = 0пп.
Твоё решение?`
      },

      stage3: {
        system: `Ты эксперт по Техасскому Холдему (6-max NLH Cash). Сейчас префлоп, банк не открыт (все сбросили до тебя). Твоё решение: Рейз 2.5bb или Фолд. Правило: играй тайтово из ранних позиций (UTG) и лузово из поздних (BTN). Факты (позиция, категория руки) посчитаны движком. В <thought> кратко объясни, почему эта категория руки подходит или не подходит для данной позиции. В <action> выдай ровно 'Рейз 2.5bb' или 'Фолд'.`,
        user: `NLH 6-max cash. Твоя позиция: BTN.
Твоя рука: A♠ 5♠.
Факты от движка: Категория руки = Suited Ax.
Действие до тебя: Все сбросили (Unopened pot).
Твоё решение?`
      },

      stage4: {
        system: `Ты эксперт по Техасскому Холдему (6-max NLH Cash). Сейчас префлоп. Игрок до тебя сделал рейз 2.5bb. Ты должен решить: Фолд, Колл 2.5bb или 3-бет (ререйз до 9bb). Правила GTO на основе фактов движка: 1. Если стиль 'Вэлью 3-бет' — всегда делай 3-бет. 2. Если стиль 'Сет-майнинг' или 'Позиционный розыгрыш' — всегда КОЛЛИРУЙ (Колл 2.5bb). Не фолди и не рейзи. 3. Если стиль 'Недостаточно эквити' — всегда ФОЛДИ. В <thought> кратко объясни логику на основе категории и стиля. В <action> выдай ровно 'Фолд', 'Колл 2.5bb' или '3-бет 9bb'.`,
        user: `NLH 6-max cash. Эффективный стек: 100bb.
Действие: Игрок на UTG сделал рейз 2.5bb. Все сбросили до тебя.
Твоя позиция: BTN.
Твоя рука: 7♠ 6♠.
Факты от движка: Категория = Suited Connectors, Стиль розыгрыша = Позиционный розыгрыш.
Твоё решение?`
      }
    };

    function setPreset(name) {
      document.getElementById("system").value = PRESETS[name].system;
      document.getElementById("user").value = PRESETS[name].user;
      document.getElementById("parsed").textContent = "—";
      document.getElementById("parsed").className = "bad";
      document.getElementById("raw").textContent = "";
    }

    function parseDecision(text) {
      const thoughtMatch = text.match(/<thought>\s*([\s\S]*?)\s*<\/thought>/i);
      const actionMatch = text.match(/<action>\s*([\s\S]*?)\s*<\/action>/i);

      const thought = thoughtMatch ? thoughtMatch[1].trim() : "";
      const actionText = actionMatch ? actionMatch[1].trim() : text;

      let action = "unknown";
      let amount = 0;

      const upper = actionText.toUpperCase();

      if (/FOLD|ФОЛД|СБРОС|ПАС/.test(upper)) {
        action = "fold";
      } else if (/CALL|КОЛЛ|УРАВНЯТЬ|ДОСТАВИТЬ/.test(upper)) {
        action = "call";
      } else if (/RAISE|РЕЙЗ|3[-\s]?БЕТ|3[-\s]?BET|ПОДНЯТЬ/.test(upper)) {
        action = "raise";
      } else if (/CHECK|ЧЕК/.test(upper)) {
        action = "check";
      } else if (/BET|БЕТ|СТАВКА/.test(upper)) {
        action = "bet";
      }

      const numMatch = actionText.replace(/\$/g, "").match(/(\d+(?:[.,]\d+)?)/);
      if (numMatch) {
        amount = parseFloat(numMatch[1].replace(",", "."));
      }

      return { thought, action, amount, raw: text };
    }

    async function sendDecide() {
      const system = document.getElementById("system").value;
      const user = document.getElementById("user").value;

      const parsedDiv = document.getElementById("parsed");
      const rawDiv = document.getElementById("raw");

      parsedDiv.textContent = "Загрузка...";
      parsedDiv.className = "bad";
      rawDiv.textContent = "";

      try {
        const res = await fetch("/decide", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ system, user })
        });

        const data = await res.json();

        if (!res.ok) {
          parsedDiv.textContent = "Ошибка сервера: " + (data.error || res.statusText);
          rawDiv.textContent = JSON.stringify(data, null, 2);
          return;
        }

        const response = data.response || "";
        rawDiv.textContent = response;

        const parsed = parseDecision(response);

        if (parsed.action === "unknown") {
          parsedDiv.textContent = "Не удалось распознать действие. Посмотри сырой ответ.";
          parsedDiv.className = "bad";
        } else {
          parsedDiv.textContent =
            `action=${parsed.action.toUpperCase()} | amount=${parsed.amount}` +
            (parsed.thought ? `\n\nthought:\n${parsed.thought}` : "");
          parsedDiv.className = "good";
        }
      } catch (e) {
        parsedDiv.textContent = "Ошибка запроса: " + e;
        rawDiv.textContent = String(e);
      }
    }

    // Сразу ставим Stage 2 для быстрой проверки
    setPreset("stage2");
  </script>
</body>
</html>
